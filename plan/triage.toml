# ---------------------------------------------------------------------------
# 11.5 Behaviour that looks like a bug or a trap
# ---------------------------------------------------------------------------

[[item]]
id = "S11.5-01"
spec = "§11.5"
summary = "Epic, Battle.net and Riot journal the snapshot before any write, so a switch whose writes are all no-ops can end 'failed' with a backupId and restored null, and a crash can raise a recovery prompt for a write that never happened; Steam's credentials path takes a snapshot but never fires onBackup."
recommend = "keep"
why = "Journal and backup ordering is the most safety-critical code and is diffed step by step in replay; port as coded and treat the spurious prompt as a fix candidate after cutover."
decision = "keep"
source = ""
affects = []

[[item]]
id = "S11.5-02"
spec = "§11.5"
summary = "Epic's settingsPaths picks the newest settings file by mtime with a 2 s tie rule favouring WindowsEditor, and the session is written into both files although the launcher reads only the newest."
recommend = "keep"
why = "Which launcher files are written is exactly what replay and the real switches verify; writing one file only is roadmap item C9, after cutover."
decision = "keep"
source = ""
affects = []

[[item]]
id = "S11.5-03"
spec = "§11.5"
summary = "Game.lastLaunch relies on SQLite's bare-column rule to pick the account_id that goes with MAX(launched_at)."
recommend = "keep"
why = "The Rust build runs the same SQL on the same SQLite engine, so the result is identical including ties; rewriting the query risks a different tie-break."
decision = "keep"
source = ""
affects = []

