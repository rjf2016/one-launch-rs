# Triage table for the Rust rewrite: one row per item in spec/SPEC.md section 11 (known issues and bloat)
# and section 12 (open questions), then the rows found during planning and during Milestone 0 (ids X-..).
# The owner approves this table before any Rust is written. Agents never decide these ad hoc.
#
# How to fill it in: set `decision` on every row whose `decision` is empty.
#   decision = "keep"   port it exactly as the Electron code behaves, quirks included
#   decision = "drop"   do not port it (dead surface, dev weight, Electron-only cost)
#   decision = "fix"    port the corrected or deliberately changed behaviour described in `why`
# A note may follow after a colon, for example "fix: cap at 4 MiB".
# `recommend` is the planning recommendation; "decide" means it needs your product answer and `why` lists the options.
# Rows with source = "plan" were settled when the rewrite plan was approved and are pre-filled.
# Rows with source = "delegated" are technical rows with no product effect, which the owner left to the agents
# ("I will make product decisions, you make technical decisions"); the owner may overrule any of them.
# `affects` lists the oracle artefacts a non-keep decision changes; it is filled during Milestone 0.
# This file is a protected path: changes need the owner's approval.

# ---------------------------------------------------------------------------
# 11.1 Memory and CPU
# ---------------------------------------------------------------------------

[[item]]
id = "S11.1-01"
spec = "§11.1"
summary = "Every registry read and process check spawns a child process (cmd.exe plus reg.exe, or PowerShell compiling C# on each call, about 0.2 s), and the adapters call them freely."
recommend = "drop"
why = "Native registry and process APIs remove the cost; the adapters' call pattern and the rules of spec section 8 stay."
decision = "drop: native registry and process APIs under the same no-handle and Riot rules"
source = "plan"
affects = []

[[item]]
id = "S11.1-02"
spec = "§11.1"
summary = "The renderer polls launch:status (150 ms), artwork:status (0.5 to 4 s) and updates:status (1 to 60 s), never backing off, even while the window is hidden."
recommend = "drop"
why = "Backend events update the UI directly; the banner, flash and clipboard timings the user sees are unchanged."
decision = "drop: push replaces polling inside the app and user-visible timings stay; the status queries remain in the command surface for replay"
source = "plan"
affects = []

[[item]]
id = "S11.1-03"
spec = "§11.1"
summary = "Repeated reads that could be cached: app:info and settings:getAll from several mounts; Epic's currentSession recomputed up to six times per operation; Epic launchGame re-parsing every manifest; Battle.net storedValueName decrypting the whole session blob for a plan."
recommend = "keep"
why = "UI-side duplicates disappear with shared stores, but adapter recomputation stays as coded: caching changes which launcher state a decision sees and would diverge from the replays; optimise after cutover."
decision = "keep"
source = ""
affects = []

[[item]]
id = "S11.1-04"
spec = "§11.1"
summary = "Unbounded data: launch_history has no index, cap or foreign keys; artwork rows are pruned only on a library scan; settings rows for removed keys stay; the redaction name set stops growing at 2,000; the database is copied in full on every start."
recommend = "keep"
why = "The schema stays at v5 and both builds share the data folder until cutover, so storage behaviour is ported as it is; retention is a later product call (see S12.3-30)."
decision = "keep"
source = ""
affects = []

[[item]]
id = "S11.1-05"
spec = "§11.1"
summary = "The poster grid is not virtualised and re-renders on every status poll and keystroke."
recommend = "drop"
why = "The Rust grid virtualises rows and decodes images off the UI thread; the layout rules (column sizing, gaps, fallbacks) are matched exactly."
decision = "drop"
source = ""
affects = []

[[item]]
id = "S11.1-06"
spec = "§11.1"
summary = "Install size is 372 MiB, 98.8 % of it Electron."
recommend = "drop"
why = "An Electron-only cost; a native binary has no equivalent."
decision = "drop"
source = ""
affects = []

[[item]]
id = "S11.1-07"
spec = "§11.1"
summary = "Five adapter file reads are uncapped (Steam's two loginusers.vdf re-reads, Epic writeSession, the Battle.net config re-read, the Riot lockfile), unlike every other launcher-file read."
recommend = "fix"
why = "Cap them with the existing 4 MiB and 1 MiB limits and the same refusal the capped reads give; behaviour differs only for oversized files, and uncapped reads break the project's own parser rule."
decision = "fix"
source = ""
affects = []

